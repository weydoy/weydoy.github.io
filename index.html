<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Amy 25</title>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

/* COUNTDOWN */
#countdown{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:40px;
}

/* FIREWORK CANVAS */
canvas{
    position:fixed;
    top:0;
    left:0;
}

/* FINAL LETTER SCREEN */
#finalScreen{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom,#fff0f6,#e0f7fa);

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:80px 40px;

    font-family:'Special Elite', monospace;
    font-size:18px;
    line-height:1.9;
    letter-spacing:0.5px;
    color:#222;

    overflow-y:auto;

    opacity:0;
    pointer-events:none;
    transition:opacity 2s ease;
    z-index:10;
}

#typewriter{
    max-width:720px;
    margin:0 auto;
}

/* FROG */
#frog{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    font-size:50px;
    opacity:0;
    transition:opacity 2s ease;
}

/* MOUSE */
#mouse{
    position:fixed;
    bottom:30px;
    right:40px;
    font-size:40px;
}

.tail{
    position:absolute;
    width:30px;
    height:30px;
    border:4px solid pink;
    border-left:none;
    border-top:none;
    border-radius:50%;
    bottom:10px;
    right:-20px;
    transform:rotate(45deg);
}

/* Frog Jump */
@keyframes jump{
    0%{transform:translateX(-50%) translateY(0);}
    50%{transform:translateX(-50%) translateY(-40px);}
    100%{transform:translateX(-50%) translateY(0);}
}

/* Frog Blink */
@keyframes blink{
    0%,95%,100%{opacity:1;}
    97%{opacity:0;}
}
</style>
</head>

<body>

<div id="countdown"></div>

<canvas id="fireworks"></canvas>

<div id="finalScreen">
    <div id="typewriter"></div>
</div>

<div id="frog">🐸</div>

<div id="mouse">
    🐭
    <div class="tail"></div>
</div>

<script>

/* 5 SECOND PREVIEW TIMER */
const targetDate = new Date().getTime() + 5000;
const countdownElement = document.getElementById("countdown");

const interval = setInterval(()=>{
    const now = new Date().getTime();
    const distance = targetDate - now;

    const seconds = Math.floor((distance % (1000*60)) / 1000);
    countdownElement.innerHTML = seconds + "s";

    if(distance <= 0){
        clearInterval(interval);
        countdownElement.style.display="none";
        startFireworks();

        setTimeout(()=>{
            document.getElementById("finalScreen").style.opacity="1";
            document.getElementById("finalScreen").style.pointerEvents="auto";
            document.getElementById("frog").style.opacity="1";
            startTypewriter();
            makeFrogJump();
            makeFrogBlink();
        },6000);
    }
},1000);


/* FIREWORKS */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(){
    for(let i=0;i<100;i++){
        particles.push({
            x:canvas.width/2,
            y:canvas.height/2,
            vx:(Math.random()-0.5)*8,
            vy:(Math.random()-0.5)*8,
            alpha:1
        });
    }
}

function startFireworks(){
    createFirework();
    animateFireworks();
}

function animateFireworks(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;
        p.alpha-=0.01;

        ctx.globalAlpha=p.alpha;
        ctx.fillStyle="white";
        ctx.fillRect(p.x,p.y,2,2);
    });
    requestAnimationFrame(animateFireworks);
}


/* TYPEWRITER */
function startTypewriter(){

const message = `Happy birthday to my precious angel, my warm sun in the cold bleak winter days.

You're 25! according to some ;_; that makes you apart of the official mid 20's gang. I hope when this counter ticked to 0 you were surrounded by your friends, maybe a million beers deep and getting smothered with love.

The next 24 hours is all about you! don't be scared (you wont) to remind everyone you get a free pass for the day, and you may ragebait or witch to your hearts desires without any repercussions.

25 short years you've lived on this rock, but god you have lived it. The experiences you have triumphed over, and connections you continue to make, has shaped you into the 25 year old woman staring back at you in the mirror. that woman is a continuous source of inspiration to me. She is strong, she is compassionate, she is sincere, she is patient, she is generous.

Unfortunately I wont be here with you today, nor have I been there for the last 24 birthdays gone by. If I was, you may not be that woman whom i am most proud of.. But, if you'll let me, I'd very much enjoy spending the next 25 birthdays with you in my arms. because at the moment, I wake in the night and immediately reach for my phone, but I would really love to wake to the sound of Japanese tv and the warmth of a heavy head on my chest.

Cakes and Candles Amy x
Don't party too hard.

Yours,
Weylin`;

const element = document.getElementById("typewriter");
let index=0;

function type(){
    if(index<message.length){
        const char=message.charAt(index);
        element.innerHTML+=char==="\n"?"<br><br>":char;
        index++;

        let delay=55;

        if(char==="." ) delay=250;

        if(message.substring(index-7,index).includes("Weylin")){
            delay=300;
        }

        setTimeout(type,delay);
    }
}
type();
}


/* FROG ANIMATION */
function makeFrogJump(){
    const frog=document.getElementById("frog");
    frog.style.animation="jump 1s ease infinite";
}

function makeFrogBlink(){
    const frog=document.getElementById("frog");
    frog.style.animation += ", blink 4s infinite";
}

</script>

</body>
</html>
